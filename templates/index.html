<!DOCTYPE html>
<html lang="te">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ganesh Donation</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- =========================================
     HOME PAGE
========================================= -->

<div class="home-page" id="homePage">

    <!-- Decorative background -->
    <div class="temple-glow"></div>

    <div class="home-content">

        <!-- TEAM TITLE -->

        <div class="title-area">

            <div class="om-symbol">ॐ</div>

            <h1>శ్రీ బాల గణేష్</h1>

            <h2>మహోత్సవం</h2>

            <div class="title-line"></div>

        </div>


        <!-- GANESH IMAGE -->

        <div class="ganesh-area">

            <img
                src="{{ url_for('static', filename='ganesh-bg.png') }}"
                alt="Lord Ganesha"
                class="ganesh-image">

        </div>


        <!-- BUTTONS -->

        <div class="home-buttons">

            <button
                type="button"
                class="home-btn donate-btn"
                onclick="openDonation()">

                <span class="button-icon">🙏</span>

                <span class="button-text">
                    Donate
                </span>

            </button>


            <button
                type="button"
                class="home-btn dashboard-btn"
                onclick="openDashboard()">

                <span class="button-icon">📊</span>

                <span class="button-text">
                    Dashboard
                </span>

            </button>

        </div>


        <div class="home-footer">
            || శ్రీ గణేశాయ నమః ||
        </div>

    </div>

</div>


<!-- =========================================
     DONATION PAGE
========================================= -->

<div class="donation-page" id="donationPage">

    <div class="donation-card">

        <button
            type="button"
            class="back-btn"
            onclick="goHome()">

            ← Back

        </button>


        <div class="header">

            <div class="ganesh-symbol">
                🙏
            </div>

            <h1>శ్రీ బాల గణేష్</h1>

            <h2>మహోత్సవం</h2>

            <p>DONATION MANAGEMENT</p>

        </div>


        <form action="/donate" method="POST">

            <div class="form-group">

                <label>Donor Name</label>

                <input
                    type="text"
                    name="donor_name"
                    placeholder="Enter donor name"
                    required>

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter 10 digit phone number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required>

            </div>


            <div class="form-group">

                <label>Donation Amount</label>

                <div class="amount-input">

                    <span>₹</span>

                    <input
                        type="number"
                        name="amount"
                        placeholder="Enter amount"
                        min="1"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label>Payment Method</label>

                <select
                    name="payment_method"
                    required>

                    <option value="">
                        Select Payment Method
                    </option>

                    <option value="Cash">
                        💵 Cash
                    </option>

                    <option value="UPI">
                        📱 UPI
                    </option>

                    <option value="Bank Transfer">
                        🏦 Bank Transfer
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>WhatsApp Available?</label>

                <div class="radio-group">

                    <label>
                        <input
                            type="radio"
                            name="whatsapp"
                            value="Yes"
                            required>
                        Yes
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="whatsapp"
                            value="No">
                        No
                    </label>

                </div>

            </div>


            <button
                type="submit"
                class="submit-btn">

                🙏 Submit Donation

            </button>

        </form>


        <div class="footer-text">
            || శ్రీ గణేశాయ నమః ||
        </div>

    </div>

</div>


<script>

function openDonation() {

    document.getElementById("homePage").style.display = "none";

    document.getElementById("donationPage").style.display = "flex";

    window.scrollTo(0, 0);

}


function goHome() {

    document.getElementById("donationPage").style.display = "none";

    document.getElementById("homePage").style.display = "flex";

    window.scrollTo(0, 0);

}


function openDashboard() {

    window.location.href = "/admin";

}

</script>

</body>

</html>
